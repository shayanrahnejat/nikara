<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e8" />
    <meta name="description" content="نیک آرا؛ طراحی و تامین ولکام پک، گیفت باکس و هدایای سازمانی از یک محصول تا یک مجموعه کامل، با برآورد بازه قیمت." />

    <meta property="og:description" content="باکس و محصولات را انتخاب کنید، بازه قیمت را ببینید و پیشنهاد اختصاصی سازمانتان را دریافت کنید." />
    <title>نیک آرا | هدایای سازمانی و ولکام پک</title>
    <style>
:root {
  --ink: #151513;
  --ink-soft: #5d5a53;
  --paper: #f6f1e8;
  --paper-2: #fffaf3;
  --white: #fffefd;
  --line: rgba(32, 28, 22, 0.11);
  --gold: #bb8a43;
  --gold-light: #e9c17e;
  --dark: #11110f;
  --success: #436c58;
  --radius-xl: 36px;
  --radius-lg: 26px;
  --radius-md: 18px;
  --shadow: 0 24px 80px rgba(44, 35, 24, 0.12);
  --font: "Vazirmatn", "IRANSansX", "Tahoma", "Segoe UI", sans-serif;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--paper); }
body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 3%, rgba(224, 184, 116, 0.16), transparent 25rem),
    linear-gradient(180deg, #faf6ef 0, var(--paper) 42rem, #f8f4ed 100%);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
}
body.menu-open { overflow: hidden; }
button, input { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { color: inherit; }
a { color: inherit; text-decoration: none; }
img { display: block; max-width: 100%; }
::selection { background: var(--gold-light); color: var(--dark); }

.section {
  width: min(1180px, calc(100% - 32px));
  margin-inline: auto;
  padding-block: 84px;
}

.island-shell {
  position: fixed;
  z-index: 100;
  top: max(10px, env(safe-area-inset-top));
  left: 50%;
  width: min(690px, calc(100% - 24px));
  transform: translateX(-50%);
}
.island {
  height: 52px;
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 18px;
  padding: 6px 8px 6px 14px;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 999px;
  color: #fff;
  background: rgba(13, 13, 12, .92);
  box-shadow: 0 14px 40px rgba(0,0,0,.22);
  backdrop-filter: blur(24px) saturate(140%);
  -webkit-backdrop-filter: blur(24px) saturate(140%);
}
.wordmark {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 17px;
  font-weight: 760;
  letter-spacing: -.03em;
  white-space: nowrap;
}
.wordmark i {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--gold-light);
  box-shadow: 0 0 12px rgba(233, 193, 126, .7);
}
.nav-links {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  font-size: 12px;
  color: rgba(255,255,255,.68);
}
.nav-links a { transition: color .2s ease; }
.nav-links a:hover { color: #fff; }
.island-call {
  height: 40px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 0 14px;
  border-radius: 999px;
  color: #1b1813;
  background: linear-gradient(135deg, #f6d394, #d7a657);
  font-size: 12px;
  font-weight: 800;
}
.menu-button {
  display: none;
  width: 38px;
  height: 38px;
  border: 0;
  border-radius: 50%;
  color: #fff;
  background: transparent;
  place-items: center;
  cursor: pointer;
}
.mobile-menu {
  display: none;
  margin-top: 8px;
  padding: 14px;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 24px;
  background: rgba(15,15,14,.96);
  color: #fff;
  box-shadow: 0 20px 50px rgba(0,0,0,.25);
}
.mobile-menu a {
  display: flex;
  padding: 13px 10px;
  border-bottom: 1px solid rgba(255,255,255,.08);
  font-size: 13px;
}
.mobile-menu a:last-child { border: 0; }

.hero {
  min-height: 92vh;
  display: grid;
  grid-template-columns: minmax(0, .94fr) minmax(420px, 1.06fr);
  align-items: center;
  gap: 7vw;
  padding-top: 118px;
  padding-bottom: 62px;
}
.eyebrow, .step-label {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  color: #9c6c2e;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .05em;
}
.hero h1 {
  max-width: 680px;
  margin: 18px 0 22px;
  font-size: clamp(44px, 6vw, 86px);
  line-height: 1.06;
  letter-spacing: -.065em;
}
.hero h1 em {
  display: block;
  color: var(--gold);
  font-style: normal;
}
.hero-copy > p {
  max-width: 600px;
  margin: 0;
  color: var(--ink-soft);
  font-size: clamp(15px, 1.35vw, 19px);
  line-height: 2;
}
.hero-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-top: 30px;
}
.button {
  min-height: 50px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  padding: 0 20px;
  border: 1px solid transparent;
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 850;
  transition: transform .22s ease, box-shadow .22s ease, background .22s ease;
}
.button:hover { transform: translateY(-2px); }
.button.primary {
  color: #fff;
  background: var(--dark);
  box-shadow: 0 14px 32px rgba(17,17,15,.18);
}
.button.primary svg { transform: rotate(180deg); }
.button.ghost {
  color: var(--ink);
  border-color: var(--line);
  background: rgba(255,255,255,.55);
}
.button.subtle {
  min-height: 46px;
  border-color: rgba(255,255,255,.12);
  color: rgba(255,255,255,.74);
  background: rgba(255,255,255,.04);
}
.button.full { width: 100%; }
.hero-proof {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  margin-top: 28px;
  color: #70695f;
  font-size: 11px;
}
.hero-proof span { display: inline-flex; align-items: center; gap: 6px; }
.hero-proof svg { color: var(--gold); }

.hero-visual { position: relative; padding: 16px 18px 45px 0; }
.hero-frame {
  position: relative;
  overflow: hidden;
  min-height: 590px;
  border: 1px solid rgba(255,255,255,.66);
  border-radius: 46px;
  background: #ded7cb;
  box-shadow: var(--shadow);
}
.hero-frame::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, transparent 56%, rgba(10,10,9,.72));
  pointer-events: none;
}
.hero-frame img {
  width: 100%;
  height: 100%;
  min-height: 590px;
  object-fit: cover;
  transition: opacity .2s ease;
}
.image-tag {
  position: absolute;
  z-index: 2;
  right: 24px;
  bottom: 22px;
  display: grid;
  gap: 4px;
  color: #fff;
}
.image-tag span { font-size: 10px; color: rgba(255,255,255,.6); }
.image-tag strong { font-size: 17px; }
.float-note {
  position: absolute;
  z-index: 3;
  left: -20px;
  bottom: 0;
  width: 230px;
  display: grid;
  gap: 5px;
  padding: 18px 20px;
  border: 1px solid rgba(255,255,255,.72);
  border-radius: 22px;
  color: var(--ink);
  background: rgba(255,250,243,.9);
  box-shadow: 0 20px 45px rgba(39,31,20,.13);
  backdrop-filter: blur(20px);
}
.float-note span, .float-note small { color: #756d62; font-size: 10px; }
.float-note strong { font-size: 15px; }

.promise-strip {
  width: min(1180px, calc(100% - 32px));
  min-height: 116px;
  margin-inline: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  padding: 26px 32px;
  border: 1px solid rgba(255,255,255,.55);
  border-radius: var(--radius-lg);
  background: linear-gradient(135deg, #e9d4ae, #f9ead0 55%, #e7c68f);
  box-shadow: 0 18px 50px rgba(108,75,34,.11);
}
.promise-strip div { display: grid; gap: 7px; }
.promise-strip strong { font-size: 20px; }
.promise-strip span { color: #625647; font-size: 12px; line-height: 1.8; }
.promise-strip a {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  font-weight: 850;
}
.promise-strip a svg { transform: rotate(180deg); }

.builder-intro { padding-bottom: 36px; }
.section-heading { max-width: 720px; margin-bottom: 42px; }
.section-heading.compact { margin-bottom: 24px; }
.section-heading h2, .block-head h2, .contact-copy h2 {
  margin: 9px 0 12px;
  font-size: clamp(30px, 4vw, 52px);
  line-height: 1.22;
  letter-spacing: -.045em;
}
.section-heading p, .block-head > p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 13px;
  line-height: 1.95;
}
.audience-pills { display: flex; flex-wrap: wrap; gap: 9px; }
.audience-pill {
  min-height: 44px;
  padding: 0 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255,255,255,.55);
  color: #575149;
  cursor: pointer;
  font-size: 12px;
  font-weight: 750;
  transition: .2s ease;
}
.audience-pill.active {
  border-color: var(--dark);
  color: #fff;
  background: var(--dark);
  box-shadow: 0 10px 24px rgba(17,17,15,.14);
}

.builder-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  align-items: start;
  gap: 28px;
  padding-top: 0;
}
.builder-main { min-width: 0; display: grid; gap: 62px; }
.builder-block {
  min-width: 0;
  padding-bottom: 62px;
  border-bottom: 1px solid var(--line);
}
.builder-block:last-child { padding-bottom: 0; border-bottom: 0; }
.block-head {
  display: grid;
  grid-template-columns: 1fr minmax(220px, 340px);
  align-items: end;
  gap: 24px;
  margin-bottom: 24px;
}
.block-head h2 { font-size: clamp(27px, 3vw, 40px); }

.box-track {
  display: grid;
  grid-auto-flow: column;
  grid-auto-columns: minmax(220px, 31%);
  gap: 12px;
  overflow-x: auto;
  padding: 4px 3px 16px;
  scroll-snap-type: x mandatory;
  scrollbar-width: thin;
  scrollbar-color: #c8bda9 transparent;
}
.box-card {
  position: relative;
  min-width: 0;
  overflow: hidden;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 22px;
  text-align: right;
  background: rgba(255,255,255,.5);
  cursor: pointer;
  scroll-snap-align: start;
  transition: border-color .22s ease, transform .22s ease, box-shadow .22s ease;
}
.box-card:hover { transform: translateY(-3px); }
.box-card.selected {
  border-color: var(--gold);
  box-shadow: 0 16px 38px rgba(78,58,29,.12);
  background: var(--white);
}
.box-photo { position: relative; aspect-ratio: 1.18; overflow: hidden; background: #e9e3da; }
.box-photo img { width: 100%; height: 100%; object-fit: cover; }
.box-photo > span {
  position: absolute;
  top: 10px;
  right: 10px;
  padding: 6px 9px;
  border-radius: 999px;
  color: #231d14;
  background: rgba(245,210,151,.92);
  font-size: 8px;
  font-weight: 850;
}
.box-card-copy { display: grid; gap: 4px; padding: 15px 15px 17px; }
.box-card-copy small { color: var(--gold); font-size: 9px; font-weight: 850; }
.box-card-copy strong { font-size: 16px; }
.box-card-copy p { min-height: 32px; margin: 0; color: #777066; font-size: 10px; line-height: 1.7; }
.box-card-copy b { margin-top: 5px; font-size: 10px; font-weight: 800; }
.select-mark, .branding-card > i {
  position: absolute;
  left: 11px;
  top: 11px;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  opacity: 0;
  color: #fff;
  background: var(--dark);
  transition: opacity .2s ease;
}
.box-card.selected .select-mark, .branding-card.selected > i { opacity: 1; }

.product-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}
.product-card {
  position: relative;
  overflow: hidden;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: 20px;
  text-align: right;
  background: rgba(255,255,255,.56);
  cursor: pointer;
  transition: transform .22s ease, border-color .22s ease, box-shadow .22s ease;
}
.product-card:hover { transform: translateY(-3px); }
.product-card.selected {
  border-color: var(--gold);
  background: var(--white);
  box-shadow: 0 14px 32px rgba(72,55,31,.1);
}

.product-copy { display: grid; gap: 4px; min-height: 104px; padding: 13px 13px 14px; }
.product-copy small { color: #857b6d; font-size: 8px; }
.product-copy strong { font-size: 13px; line-height: 1.55; }
.product-copy span { margin-top: auto; color: #735328; font-size: 9px; font-weight: 800; }
.product-toggle {
  position: absolute;
  top: 9px;
  left: 9px;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(20,20,18,.12);
  border-radius: 50%;
  color: var(--ink);
  background: rgba(255,255,255,.85);
  font-size: 17px;
  font-style: normal;
  box-shadow: 0 5px 16px rgba(0,0,0,.07);
}
.product-card.selected .product-toggle { color: #fff; background: var(--dark); }

.branding-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.branding-card {
  position: relative;
  min-height: 182px;
  display: grid;
  align-content: start;
  gap: 7px;
  padding: 19px;
  border: 1px solid var(--line);
  border-radius: 20px;
  text-align: right;
  background: rgba(255,255,255,.5);
  cursor: pointer;
  transition: .2s ease;
}
.branding-card.selected {
  border-color: var(--gold);
  background: var(--white);
  box-shadow: 0 14px 32px rgba(72,55,31,.1);
}
.branding-card > span { color: #9a7544; font-size: 8px; font-weight: 850; }
.branding-card strong { font-size: 15px; }
.branding-card p { margin: 0; color: #756e64; font-size: 10px; line-height: 1.7; }
.branding-card b { margin-top: auto; font-size: 10px; }

.summary-card {
  position: sticky;
  top: 84px;
  overflow: hidden;
  padding: 18px;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 28px;
  color: #fff;
  background:
    radial-gradient(circle at 80% 0, rgba(193,142,67,.2), transparent 16rem),
    var(--dark);
  box-shadow: 0 24px 70px rgba(20,18,14,.2);
}
.summary-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; font-size: 11px; }
.text-button { padding: 4px; border: 0; color: rgba(255,255,255,.45); background: none; cursor: pointer; font-size: 9px; }
.mini-box { position: relative; overflow: hidden; aspect-ratio: 1.35; border-radius: 17px; background: #333; }
.mini-box::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.68)); }
.mini-box img { width: 100%; height: 100%; object-fit: cover; }
.mini-box-overlay { position: absolute; z-index: 2; right: 12px; left: 12px; bottom: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
.mini-box-overlay span { padding: 4px 7px; border: 1px solid rgba(255,255,255,.12); border-radius: 999px; color: rgba(255,255,255,.8); background: rgba(0,0,0,.3); font-size: 7px; }
.summary-name { display: grid; gap: 4px; padding: 15px 2px 12px; }
.summary-name strong { font-size: 16px; }
.summary-name span { color: rgba(255,255,255,.48); font-size: 9px; }
.price-panel { display: grid; gap: 4px; padding: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 16px; background: rgba(255,255,255,.04); }
.price-panel span, .price-panel small { color: rgba(255,255,255,.46); font-size: 8px; }
.price-panel strong { color: var(--gold-light); font-size: 15px; }
.quantity-field { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; margin: 14px 0; }
.quantity-field > span { font-size: 10px; }
.quantity-field > div { display: flex; align-items: center; direction: ltr; border: 1px solid rgba(255,255,255,.1); border-radius: 999px; }
.quantity-field button { width: 32px; height: 32px; border: 0; color: #fff; background: transparent; cursor: pointer; }
.quantity-field input { width: 44px; height: 32px; border: 0; outline: 0; color: #fff; background: transparent; text-align: center; font-size: 10px; }
.quantity-field input::-webkit-inner-spin-button { appearance: none; }
.order-range { display: flex; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 16px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,.08); }
.order-range > div { display: grid; gap: 3px; }
.order-range span { font-size: 9px; }
.order-range small { color: #77aa8d; font-size: 7px; }
.order-range strong { font-size: 12px; white-space: nowrap; }
.summary-card .button.primary { color: #1a1712; background: linear-gradient(135deg, #f2ce8d, #cf9948); box-shadow: none; }
.summary-note { display: flex; align-items: flex-start; gap: 6px; margin: 11px 4px 0; color: rgba(255,255,255,.42); font-size: 8px; line-height: 1.65; }
.summary-note svg { flex: 0 0 auto; }
.mobile-estimate { display: none; }

.dark-section { color: #fff; background: var(--dark); }
.dark-inner { padding-block: 100px; }
.section-heading.light .step-label { color: var(--gold-light); }
.section-heading.light p { color: rgba(255,255,255,.58); }
.value-grid { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.value-grid article {
  min-height: 250px;
  padding: 25px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 24px;
  background: linear-gradient(145deg, rgba(255,255,255,.06), rgba(255,255,255,.015));
}
.value-grid article > span { width: 35px; height: 35px; display: grid; place-items: center; border: 1px solid rgba(232,193,125,.38); border-radius: 50%; color: var(--gold-light); font-size: 10px; }
.value-grid h3 { margin: 56px 0 10px; font-size: 19px; }
.value-grid p { margin: 0; color: rgba(255,255,255,.5); font-size: 11px; line-height: 1.9; }

.market-cards { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; }
.market-cards article {
  display: grid;
  gap: 8px;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 22px;
  background: rgba(255,255,255,.55);
}
.market-cards span, .market-cards small { color: #777067; font-size: 9px; }
.market-cards strong { font-size: 16px; line-height: 1.6; }
.source-details { margin-top: 14px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.38); }
.source-details summary { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px; list-style: none; cursor: pointer; font-size: 11px; font-weight: 800; }
.source-details summary::-webkit-details-marker { display: none; }
.source-details summary svg { transition: transform .2s ease; }
.source-details[open] summary svg { transform: rotate(90deg); }
.source-details > div { display: grid; gap: 9px; padding: 0 18px 18px; border-top: 1px solid var(--line); }
.source-details p { margin: 14px 0 4px; color: var(--ink-soft); font-size: 10px; line-height: 1.9; }
.source-details a { width: fit-content; color: #7d5727; border-bottom: 1px solid rgba(125,87,39,.25); font-size: 9px; }

.comparison-section { padding-top: 30px; }
.comparison-table { overflow: hidden; border: 1px solid var(--line); border-radius: 24px; background: rgba(255,255,255,.48); }
.comparison-row { display: grid; grid-template-columns: 1.2fr 1fr 1fr 1.1fr; border-bottom: 1px solid var(--line); }
.comparison-row:last-child { border-bottom: 0; }
.comparison-row > * { display: flex; align-items: center; min-height: 66px; padding: 14px 16px; border-left: 1px solid var(--line); font-size: 10px; line-height: 1.7; }
.comparison-row > *:last-child { border-left: 0; }
.comparison-row strong { color: #fff; background: #1b1b18; font-weight: 700; }
.comparison-row.head { color: #766f65; background: #ece4d8; }
.comparison-row.head > * { min-height: 50px; font-size: 9px; }
.comparison-row.head strong { color: var(--gold-light); }

.process-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; counter-reset: process; }
.process-grid article { min-height: 215px; padding: 22px; border-top: 1px solid #b99863; background: rgba(255,255,255,.26); }
.process-grid b { color: var(--gold); font-size: 10px; }
.process-grid h3 { margin: 52px 0 9px; font-size: 17px; }

.contact-section { width: min(1180px, calc(100% - 32px)); margin: 40px auto 16px; color: #fff; }
.contact-inner {
  display: grid;
  grid-template-columns: 1fr .86fr;
  gap: 8vw;
  padding: clamp(28px, 6vw, 76px);
  border-radius: 36px;
  background:

  box-shadow: 0 30px 80px rgba(20,18,14,.18);

.contact-copy .step-label { color: var(--gold-light); }
.contact-copy h2 { margin-top: 14px; font-size: clamp(34px, 4vw, 54px); }

.phone-display { display: inline-flex; align-items: center; gap: 10px; margin-top: 24px; color: var(--gold-light); direction: ltr; font-size: 20px; font-weight: 750; }
.proposal-form { display: grid; gap: 12px; }
.proposal-form label { display: grid; gap: 7px; }
.proposal-form label span { color: rgba(255,255,255,.58); font-size: 9px; }
.proposal-form input {
  width: 100%;
  height: 48px;
  padding: 0 15px;
  border: 1px solid rgba(255,255,255,.1);

  background: rgba(255,255,255,.05);
  font-size: 11px;
}
.proposal-form input:focus { border-color: rgba(232,193,125,.55); }
.brief-preview { padding: 14px; border: 1px solid rgba(255,255,255,.08); border-radius: 15px; background: rgba(255,255,255,.035); }
.brief-preview span { color: var(--gold-light); font-size: 8px; }
.brief-preview p { margin: 8px 0 0; color: rgba(255,255,255,.54); white-space: pre-line; font-size: 8px; line-height: 1.8; }
.proposal-form .button.primary { color: #1a1712; background: linear-gradient(135deg, #f2ce8d, #cf9948); box-shadow: none; }
.proposal-form > small { color: rgba(255,255,255,.36); font-size: 7px; line-height: 1.7; }

footer { width: min(1180px, calc(100% - 32px)); margin-inline: auto; padding: 44px 0 max(28px, env(safe-area-inset-bottom)); }
.footer-main { display: flex; align-items: end; justify-content: space-between; gap: 24px; }
.footer-brand { font-size: 24px; font-weight: 850; }

.footer-contact { display: grid; justify-items: end; gap: 5px; }
.footer-contact span { color: #777067; font-size: 8px; }
.footer-contact a { direction: ltr; font-size: 17px; font-weight: 750; }

.toast {
  position: fixed;
  z-index: 200;
  left: 50%;
  bottom: 24px;
  max-width: calc(100% - 32px);
  padding: 11px 16px;

  color: #fff;
  background: #1b1b18;
  box-shadow: 0 14px 40px rgba(0,0,0,.2);

  pointer-events: none;
  font-size: 10px;
  transition: .25s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.margin-control strong { min-width: 42px; color: #8a6029; font-size: 15px; }

}

    <section class="section comparison-section">
      <div class="section-heading">
        <span class="step-label">مقایسه مسیر خرید</span>

        <div class="comparison-row head" role="row">
          <span role="columnheader">معیار</span><span role="columnheader">خرید پراکنده</span><span role="columnheader">پک آماده</span><strong role="columnheader">نیک آرا</strong>
        </div>
        <div class="comparison-row" role="row">
          <span role="cell">انتخاب محصول</span><span role="cell">نامحدود اما زمان‌بر</span><span role="cell">ترکیب ثابت</span><strong role="cell">آزاد و هدایت‌شده</strong>
        </div>
        <div class="comparison-row" role="row">
          <span role="cell">کنترل هزینه</span><span role="cell">چند تأمین‌کننده</span><span role="cell">یک عدد ثابت</span><strong role="cell">بازه زنده و قابل حذف</strong>
        </div>
        <div class="comparison-row" role="row">
          <span role="cell">هویت سازمان</span><span role="cell">نیازمند هماهنگی جدا</span><span role="cell">محدود</span><strong role="cell">از لیبل تا طراحی کامل</strong>
        </div>
        <div class="comparison-row" role="row">
          <span role="cell">ریسک تولید</span><span role="cell">بر عهده خریدار</span><span role="cell">معمولاً بدون نمونه</span><strong role="cell">نمونه قبل از تیراژ</strong>
        </div>
      </div>
    </section>

    <section class="section process-section" id="process">
      <div class="section-heading">
        <span class="step-label">فرآیند همکاری</span>
        <h2>از انتخاب تا تحویل، در چهار تصمیم روشن</h2>

        <article><b>۰۲</b><h3>قیمت‌سنجی روز</h3><p>مدل دقیق، موجودی و قیمت تأمین‌کنندگان بررسی می‌شود.</p></article>
        <article><b>۰۳</b><h3>ماکت و نمونه</h3><p>برندینگ و جای‌گذاری پیش از تولید عمده تأیید می‌شود.</p></article>
        <article><b>۰۴</b><h3>تولید و تحویل</h3><p>پس از تأیید نهایی، تولید و برنامه تحویل هماهنگ می‌شود.</p></article>

    <section class="contact-section" id="contact">
      <div class="contact-inner">
        <div class="contact-copy">
          <span class="step-label">پیشنهاد اختصاصی سازمان شما</span>
          <h2>این انتخاب را برای نیک آرا بفرستید.</h2>
          <p>ترکیب فعلی شما آماده است. نام سازمان و شماره تماس را وارد کنید تا متن درخواست کامل شود؛ سپس می‌توانید آن را مستقیم در واتساپ ارسال کنید.</p>
          <a class="phone-display" href="tel:${CONTACT_TEL}">${icon('phone', 22)} <span>${CONTACT_DISPLAY}</span></a>
        </div>
        <form class="proposal-form" data-proposal-form>
          <label><span>نام سازمان</span><input name="organization" autocomplete="organization" placeholder="مثلاً شرکت شما" /></label>

            <span>خلاصه درخواست</span>
            <p data-brief-preview></p>
          </div>
          <button class="button primary full" type="submit">ارسال درخواست در واتساپ ${icon('arrow', 18)}</button>
          <button class="button subtle full" type="button" data-copy-brief>${icon('copy', 17)} کپی متن درخواست</button>
          <small>ارسال این فرم به معنی ثبت سفارش قطعی نیست؛ ابتدا قیمت و موجودی تأیید می‌شود.</small>

  <footer>
    <div class="footer-main">
      <div><a class="footer-brand" href="#top">نیک آرا</a><p>هدیه سازمانی، از یک انتخاب ساده تا یک تجربه کامل.</p></div>
      <div class="footer-contact"><span>مشاوره و سفارش</span><a href="tel:${CONTACT_TEL}">${CONTACT_DISPLAY}</a></div>
    </div>
    <div class="footer-bottom"><span>© ۱۴۰۵ نیک آرا</span><span>تصاویر محصولات برای نمایش کانسپت‌اند و در پیشنهاد نهایی با مدل دقیق جایگزین می‌شوند.</span></div>
  </footer>

  <div class="toast" role="status" aria-live="polite"></div>

const $ = (selector, parent = document) => parent.querySelector(selector);
const $$ = (selector, parent = document) => [...parent.querySelectorAll(selector)];
const byId = (items, id) => items.find((item) => item.id === id);
const storage = {
  get(key) {
    try { return window.localStorage.getItem(key); } catch { return null; }
  },
  set(key, value) {
    try { window.localStorage.setItem(key, value); } catch { /* file previews can block storage */ }
  },
  remove(key) {
    try { window.localStorage.removeItem(key); } catch { /* no-op */ }
  },
};
const fa = (value) => new Intl.NumberFormat('fa-IR').format(Math.round(value));
const compact = (value) => {
  if (value >= 1000000) {
    const amount = value / 1000000;
    const digits = amount >= 10 || Number.isInteger(amount) ? 0 : 1;
    return `${amount.toLocaleString('fa-IR', { maximumFractionDigits: digits })} میلیون`;
  }
  return `${Math.round(value / 1000).toLocaleString('fa-IR')} هزار`;
};
const rangeText = (low, high) => `${compact(low)} تا ${compact(high)} تومان`;

function getTotals() {
  const selectedBox = byId(boxes, state.box);
  const selectedBrand = byId(branding, state.branding);
  const selectedProducts = products.filter((product) => state.products.has(product.id));
  const low = selectedBox.low + selectedBrand.low + selectedProducts.reduce((sum, product) => sum + product.low, 0);
  const high = selectedBox.high + selectedBrand.high + selectedProducts.reduce((sum, product) => sum + product.high, 0);
  const discount = state.quantity >= 100 ? 0.07 : state.quantity >= 50 ? 0.05 : state.quantity >= 20 ? 0.03 : 0;
  return {
    selectedBox,
    selectedBrand,
    selectedProducts,
    low,
    high,
    discount,
    orderLow: low * state.quantity * (1 - discount),
    orderHigh: high * state.quantity * (1 - discount),
  };
}

function renderBoxes() {
  $('[data-box-list]').innerHTML = boxes.map((box) => `
    <button class="box-card ${state.box === box.id ? 'selected' : ''}" data-box="${box.id}" type="button" aria-pressed="${state.box === box.id}">
      <div class="box-photo"><img src="${box.image}" alt="باکس ${box.name} نیک آرا" loading="lazy" />${box.recommended ? '<span>پیشنهاد نیک آرا</span>' : ''}</div>
      <div class="box-card-copy"><small>${box.level}</small><strong>${box.name}</strong><p>${box.hint}</p><b>${rangeText(box.low, box.high)}</b></div>
      <i class="select-mark">${icon('check', 14)}</i>
    </button>
  `).join('');
}

function renderProducts() {
  $('[data-product-list]').innerHTML = products.map((product) => {
    const selected = state.products.has(product.id);
    return `
      <button class="product-card ${selected ? 'selected' : ''}" data-product="${product.id}" type="button" aria-pressed="${selected}">
        <div class="product-photo" style="--px:${product.x};--py:${product.y}" role="img" aria-label="تصویر نمونه ${product.name}"></div>
        <div class="product-copy"><small>${product.short}</small><strong>${product.name}</strong><span>${rangeText(product.low, product.high)}</span></div>
        <i class="product-toggle">${selected ? icon('check', 15) : '+'}</i>
      </button>
    `;
  }).join('');
}

function renderBranding() {
  $('[data-branding-list]').innerHTML = branding.map((item) => `
    <button class="branding-card ${state.branding === item.id ? 'selected' : ''}" data-branding="${item.id}" type="button" aria-pressed="${state.branding === item.id}">
      <span>${item.recommended ? 'پیشنهاد متعادل' : 'انتخاب آزاد'}</span>
      <strong>${item.name}</strong>
      <p>${item.note}</p>
      <b>${item.low === 0 ? 'تا ' + compact(item.high) + ' تومان' : rangeText(item.low, item.high)}</b>
      <i>${icon('check', 14)}</i>
    </button>
  `).join('');
}

function briefText(includeContact = false) {
  const totals = getTotals();
  const org = $('[name="organization"]')?.value.trim();
  const contact = $('[name="contact"]')?.value.trim();
  const productNames = totals.selectedProducts.length ? totals.selectedProducts.map((p) => p.name).join('، ') : 'بدون محصول؛ فقط باکس';
  const lines = [
    'سلام نیک آرا، برای دریافت پیشنهاد سازمانی پیام می‌دهم.',
    org ? `سازمان: ${org}` : '',
    includeContact && contact ? `نام و تماس: ${contact}` : '',
    `مخاطب: ${byId(audiences, state.audience).label}`,
    `باکس: ${totals.selectedBox.name} (${totals.selectedBox.level})`,
    `محصولات: ${productNames}`,
    `برندینگ: ${totals.selectedBrand.name}`,
    `تعداد تقریبی: ${fa(state.quantity)} عدد`,
    `بازه نمایشی هر پک: ${rangeText(totals.low, totals.high)}`,
    'لطفاً موجودی، مدل دقیق و قیمت نهایی را بررسی کنید.',
  ].filter(Boolean);
  return lines.join('\n');
}

function updateSummary() {
  const totals = getTotals();
  const count = totals.selectedProducts.length;
  $('[data-hero-image]').src = totals.selectedBox.image;
  $('[data-hero-image]').alt = `باکس ${totals.selectedBox.name} نیک آرا`;
  $('[data-hero-name]').textContent = `${totals.selectedBox.name} · ${totals.selectedBox.level}`;
  $('[data-hero-price]').textContent = rangeText(totals.low, totals.high);
  $('[data-summary-image]').src = totals.selectedBox.image;
  $('[data-summary-count]').textContent = count ? `${fa(count)} محصول · ${totals.selectedBrand.name}` : `فقط باکس · ${totals.selectedBrand.name}`;
  $('[data-unit-range]').textContent = rangeText(totals.low, totals.high);
  $('[data-mobile-range]').textContent = rangeText(totals.low, totals.high);
  $('[data-order-range]').textContent = rangeText(totals.orderLow, totals.orderHigh);
  $('[data-discount-label]').textContent = totals.discount ? `شامل ${fa(totals.discount * 100)}٪ صرفه تیراژ` : 'بدون صرفه تیراژ';
  $('[data-summary-products]').innerHTML = totals.selectedProducts.slice(0, 4).map((product) => `<span>${product.name}</span>`).join('') || '<span>باکس خالی برای انتخاب شما</span>';
  $('[data-brief-preview]').textContent = briefText(false);
  storage.set('nikaara-proposal', JSON.stringify({
    box: state.box,
    products: [...state.products],
    branding: state.branding,
    audience: state.audience,
    quantity: state.quantity,
  }));
}

function renderAll() {
  renderBoxes();
  renderProducts();
  renderBranding();
  updateSummary();
}

function showToast(message) {
  const toast = $('.toast');
  toast.textContent = message;
  toast.classList.add('show');
  clearTimeout(showToast.timer);
  showToast.timer = setTimeout(() => toast.classList.remove('show'), 2600);
}

function chooseAudience(id) {
  const audience = byId(audiences, id);
  state.audience = id;
  state.products = new Set(audience.picks);
  state.box = audience.box;
  $$('.audience-pill').forEach((button) => button.classList.toggle('active', button.dataset.audience === id));
  renderBoxes();
  renderProducts();
  updateSummary();
  showToast('یک ترکیب پیشنهادی ساخته شد؛ هر انتخاب قابل تغییر است.');
}

document.addEventListener('click', (event) => {
  const audienceButton = event.target.closest('[data-audience]');
  const boxButton = event.target.closest('[data-box]');
  const productButton = event.target.closest('[data-product]');
  const brandingButton = event.target.closest('[data-branding]');
  if (audienceButton) chooseAudience(audienceButton.dataset.audience);
  if (boxButton) {
    state.box = boxButton.dataset.box;
    renderBoxes();
    updateSummary();
  }
  if (productButton) {
    const id = productButton.dataset.product;
    state.products.has(id) ? state.products.delete(id) : state.products.add(id);
    renderProducts();
    updateSummary();
  }
  if (brandingButton) {
    state.branding = brandingButton.dataset.branding;
    renderBranding();
    updateSummary();
  }
  if (event.target.closest('[data-qty-minus]')) {
    state.quantity = Math.max(1, state.quantity - (state.quantity > 20 ? 10 : 1));
    $('[data-quantity]').value = state.quantity;
    updateSummary();
  }
  if (event.target.closest('[data-qty-plus]')) {
    state.quantity = Math.min(5000, state.quantity + (state.quantity >= 20 ? 10 : 1));
    $('[data-quantity]').value = state.quantity;
    updateSummary();
  }
  if (event.target.closest('[data-reset]')) {
    state.box = 'magnetic';
    state.products = new Set(['folio', 'powerbank', 'pen']);
    state.branding = 'signature';
    state.audience = 'client';
    state.quantity = 20;
    $('[data-quantity]').value = 20;
    $$('.audience-pill').forEach((button) => button.classList.toggle('active', button.dataset.audience === 'client'));
    renderAll();
  }
  const menuButton = event.target.closest('.menu-button');
  if (menuButton) {
    const open = document.body.classList.toggle('menu-open');
    menuButton.setAttribute('aria-expanded', String(open));
    menuButton.innerHTML = open ? icon('close', 18) : icon('menu', 18);
  }
  if (event.target.closest('.mobile-menu a')) {
    document.body.classList.remove('menu-open');
    $('.menu-button').setAttribute('aria-expanded', 'false');
    $('.menu-button').innerHTML = icon('menu', 18);
  }
});

$('[data-quantity]').addEventListener('input', (event) => {
  state.quantity = Math.max(1, Math.min(5000, Number(event.target.value) || 1));
  updateSummary();
});

$('[name="organization"]').addEventListener('input', updateSummary);
$('[name="contact"]').addEventListener('input', updateSummary);

$('[data-proposal-form]').addEventListener('submit', (event) => {
  event.preventDefault();
  const url = `https://wa.me/${CONTACT_WA}?text=${encodeURIComponent(briefText(true))}`;
  window.open(url, '_blank', 'noopener,noreferrer');
});

$('[data-copy-brief]').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(briefText(true));
    showToast('متن درخواست کپی شد.');
  } catch {
    showToast('کپی خودکار ممکن نبود؛ متن را از خلاصه انتخاب کنید.');
  }
});

$$('a[href^="#"]').forEach((link) => link.addEventListener('click', (event) => {
  const target = document.querySelector(link.getAttribute('href'));
  if (!target) return;
  event.preventDefault();
  target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}));

const saved = storage.get('nikaara-proposal');
if (saved) {
  try {
    const parsed = JSON.parse(saved);
    if (byId(boxes, parsed.box)) state.box = parsed.box;
    if (Array.isArray(parsed.products)) state.products = new Set(parsed.products.filter((id) => byId(products, id)));
    if (byId(branding, parsed.branding)) state.branding = parsed.branding;
    if (byId(audiences, parsed.audience)) state.audience = parsed.audience;
    if (Number(parsed.quantity) > 0) state.quantity = Math.min(5000, Number(parsed.quantity));
    $('[data-quantity]').value = state.quantity;
    $$('.audience-pill').forEach((button) => button.classList.toggle('active', button.dataset.audience === state.audience));
  } catch {
    storage.remove('nikaara-proposal');
  }
}

renderAll();

    </script>
  </body>
